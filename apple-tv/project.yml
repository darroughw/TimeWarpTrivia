name: TimeWarpTrivia
options:
  bundleIdPrefix: com.timewarptrivia
  deploymentTarget:
    tvOS: "16.0"
packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: 2.55.1
targets:
  TimeWarpTrivia:
    type: application
    platform: tvOS
    deploymentTarget: "16.0"
    sources:
      - path: TimeWarpTrivia
    dependencies:
      - package: Supabase
    configFiles:
      Debug: Signing.xcconfig
      Release: Signing.xcconfig
    # UIAppFonts needs a real plist array, which the INFOPLIST_KEY_*
    # build-setting bridge can't carry (confirmed empirically — it just
    # silently drops it, same failure mode Config.swift hit with
    # GENERATE_INFOPLIST_FILE earlier). Switched to xcodegen's physical
    # Info.plist mechanism instead; UILaunchScreen/UIApplicationSceneManifest
    # below are the raw-key equivalents of the two
    # INFOPLIST_KEY_*_Generation build settings this replaces — xcodegen
    # still auto-populates the standard keys (CFBundleIdentifier etc.)
    # either way.
    info:
      path: TimeWarpTrivia/Info.plist
      properties:
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        # Only HTTPS via URLSession (through the supabase-swift package) —
        # no proprietary or self-implemented crypto — so this is exempt
        # and set here to skip App Store Connect's encryption prompt on
        # every future upload.
        ITSAppUsesNonExemptEncryption: false
        UIAppFonts:
          - Archivo-Regular.ttf
          - Archivo-Bold.ttf
          - ArchivoBlack-Regular.ttf
          - SpaceMono-Regular.ttf
          - SpaceMono-Bold.ttf
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.timewarptrivia.appletv
        PRODUCT_NAME: TimeWarpTrivia
        ASSETCATALOG_COMPILER_APPICON_NAME: "App Icon & Top Shelf Image"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "3"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
